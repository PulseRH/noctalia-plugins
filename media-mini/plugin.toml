id = "pulser/media-mini"
name = "Media (mini)"
version = "1.2.0"
plugin_api = 32
author = "pulser"
license = "MIT"
dependencies = ["playerctl", "sh"]
tags = ["media"]
icon = "player-play-filled"
description = "Classic now-playing artwork and progress pill, configurable widths, and an optional interactive seek slider."

[[widget]]
id = "media"
entry = "media.luau"

[widget.actions]
right = "panel-toggle control-center media"

[[widget.setting]]
key = "progress_thickness"
type = "int"
label_key = "media_mini.settings.progress_thickness.label"
description_key = "media_mini.settings.progress_thickness.description"
default = 8
min = 4
max = 24
step = 1

[[widget.setting]]
key = "progress_style"
type = "select"
label_key = "media_mini.settings.progress_style.label"
description_key = "media_mini.settings.progress_style.description"
default = "classic"
options = [
  { value = "classic", label_key = "media_mini.settings.progress_style.options.classic" },
  { value = "classic_drag", label_key = "media_mini.settings.progress_style.options.classic_drag" },
  { value = "interactive", label_key = "media_mini.settings.progress_style.options.interactive" },
]

[[widget.setting]]
key = "show_cover_art"
type = "bool"
label_key = "media_mini.settings.show_cover_art.label"
description_key = "media_mini.settings.show_cover_art.description"
default = true

[[widget.setting]]
key = "show_progress_bar"
type = "bool"
label_key = "media_mini.settings.show_progress_bar.label"
description_key = "media_mini.settings.show_progress_bar.description"
default = true

[[widget.setting]]
key = "compact_width"
type = "int"
label_key = "media_mini.settings.compact_width.label"
description_key = "media_mini.settings.compact_width.description"
default = 20
min = 8
max = 60
step = 1

[[widget.setting]]
key = "expand_width"
type = "int"
label_key = "media_mini.settings.expand_width.label"
description_key = "media_mini.settings.expand_width.description"
default = 40
min = 8
max = 100
step = 1

[[widget.setting]]
key = "cover_size"
type = "int"
label_key = "media_mini.settings.cover_size.label"
description_key = "media_mini.settings.cover_size.description"
default = 20
min = 12
max = 40
step = 1

[[widget.setting]]
key = "corner_rounding"
type = "int"
label_key = "media_mini.settings.corner_rounding.label"
description_key = "media_mini.settings.corner_rounding.description"
default = 100
min = 0
max = 100
step = 5

[[widget.setting]]
key = "progress_width"
type = "int"
label_key = "media_mini.settings.progress_width.label"
description_key = "media_mini.settings.progress_width.description"
default = 35
min = 24
max = 300
step = 2

[[widget.setting]]
key = "progress_expand_width"
type = "int"
label_key = "media_mini.settings.progress_expand_width.label"
description_key = "media_mini.settings.progress_expand_width.description"
default = 35
min = 24
max = 500
step = 2
