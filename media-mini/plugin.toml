id = "pulser/media-mini"
name = "Media (mini)"
version = "1.10.1"
plugin_api = 32
author = "pulser"
license = "MIT"
dependencies = ["playerctl", "sh"]
tags = ["media"]
icon = "player-play-filled"
description = "Classic now-playing artwork and progress pill, configurable widths, and an optional interactive seek slider."

[[widget]]
id = "media"
entry = "media.luau"

[widget.actions]
right = "none"

[[widget.setting]]
key = "show_cover_art"
type = "bool"
label_key = "media_mini.settings.show_cover_art.label"
description_key = "media_mini.settings.show_cover_art.description"
default = true

[[widget.setting]]
key = "corner_rounding"
visible_when = { key = "show_cover_art", values = ["true"] }
type = "int"
label_key = "media_mini.settings.corner_rounding.label"
description_key = "media_mini.settings.corner_rounding.description"
default = 100
min = 0
max = 100
step = 5

[[widget.setting]]
key = "cover_size"
type = "int"
label_key = "media_mini.settings.cover_size.label"
description_key = "media_mini.settings.cover_size.description"
default = 20
min = 12
max = 40
step = 1

[[widget.setting]]
key = "show_controls"
type = "bool"
label_key = "media_mini.settings.show_controls.label"
description_key = "media_mini.settings.show_controls.description"
default = false

[[widget.setting]]
key = "controls_on_hover"
visible_when = { key = "show_controls", values = ["true"] }
type = "bool"
label_key = "media_mini.settings.controls_on_hover.label"
description_key = "media_mini.settings.controls_on_hover.description"
default = false

[[widget.setting]]
key = "scroll_action"
type = "select"
label_key = "media_mini.settings.scroll_action.label"
description_key = "media_mini.settings.scroll_action.description"
default = "tracks"
options = [
  { value = "tracks", label_key = "media_mini.settings.scroll_action.options.tracks" },
  { value = "seek", label_key = "media_mini.settings.scroll_action.options.seek" },
]

[[widget.setting]]
key = "scroll_seek_step"
visible_when = { key = "scroll_action", values = ["seek"] }
type = "int"
label_key = "media_mini.settings.scroll_seek_step.label"
description_key = "media_mini.settings.scroll_seek_step.description"
default = 5
min = 1
max = 60
step = 1

[[widget.setting]]
key = "audio_spectrum"
type = "bool"
label_key = "media_mini.settings.audio_spectrum.label"
description_key = "media_mini.settings.audio_spectrum.description"
default = false

[[widget.setting]]
key = "audio_spectrum_bands"
visible_when = { key = "audio_spectrum", values = ["true"] }
type = "int"
label_key = "media_mini.settings.audio_spectrum_bands.label"
description_key = "media_mini.settings.audio_spectrum_bands.description"
default = 16
min = 8
max = 128
step = 4

[[widget.setting]]
key = "visualiser_mode"
visible_when = { key = "audio_spectrum", values = ["true"] }
type = "select"
label_key = "media_mini.settings.visualiser_mode.label"
description_key = "media_mini.settings.visualiser_mode.description"
default = "overlay"
options = [
  { value = "overlay", label_key = "media_mini.settings.visualiser_mode.options.overlay" },
  { value = "played_only", label_key = "media_mini.settings.visualiser_mode.options.played_only" },
  { value = "inverted", label_key = "media_mini.settings.visualiser_mode.options.inverted" },
  { value = "progress", label_key = "media_mini.settings.visualiser_mode.options.progress" },
]

[[widget.setting]]
key = "visualiser_color"
visible_when = { key = "audio_spectrum", values = ["true"] }
type = "color"
label_key = "media_mini.settings.visualiser_color.label"
description_key = "media_mini.settings.visualiser_color.description"
default = "secondary"

[[widget.setting]]
key = "visualiser_opacity"
visible_when = { key = "audio_spectrum", values = ["true"] }
type = "int"
label_key = "media_mini.settings.visualiser_opacity.label"
description_key = "media_mini.settings.visualiser_opacity.description"
default = 35
min = 0
max = 100
step = 1

[[widget.setting]]
key = "visualiser_height"
visible_when = { key = "audio_spectrum", values = ["true"] }
type = "int"
label_key = "media_mini.settings.visualiser_height.label"
description_key = "media_mini.settings.visualiser_height.description"
default = 12
min = 4
max = 24
step = 1

[[widget.setting]]
key = "visualiser_width"
visible_when = { key = "progress_layout", values = ["inline"] }
type = "int"
label_key = "media_mini.settings.visualiser_width.label"
description_key = "media_mini.settings.visualiser_width.description"
default = 48
min = 24
max = 160
step = 2

[[widget.setting]]
key = "show_progress_bar"
type = "bool"
label_key = "media_mini.settings.show_progress_bar.label"
description_key = "media_mini.settings.show_progress_bar.description"
default = true

[[widget.setting]]
key = "point_style"
visible_when = { key = "show_progress_bar", values = ["true"] }
type = "select"
label_key = "media_mini.settings.point_style.label"
description_key = "media_mini.settings.point_style.description"
default = "rounded"
options = [
  { value = "rounded", label_key = "media_mini.settings.point_style.options.rounded" },
  { value = "flat", label_key = "media_mini.settings.point_style.options.flat" },
]

[[widget.setting]]
key = "progress_layout"
visible_when = { key = "show_progress_bar", values = ["true"] }
type = "select"
label_key = "media_mini.settings.progress_layout.label"
description_key = "media_mini.settings.progress_layout.description"
default = "inline"
options = [
  { value = "inline", label_key = "media_mini.settings.progress_layout.options.inline" },
  { value = "background", label_key = "media_mini.settings.progress_layout.options.background" },
]

[[widget.setting]]
key = "progress_darkening"
visible_when = { key = "show_progress_bar", values = ["true"] }
type = "int"
label_key = "media_mini.settings.progress_darkening.label"
description_key = "media_mini.settings.progress_darkening.description"
default = 0
min = 0
max = 80
step = 1

[[widget.setting]]
key = "background_progress_color"
visible_when = { key = "progress_layout", values = ["background"] }
type = "color"
label_key = "media_mini.settings.background_progress_color.label"
description_key = "media_mini.settings.background_progress_color.description"
default = "primary"

[[widget.setting]]
key = "background_darkening"
visible_when = { key = "progress_layout", values = ["background"] }
type = "int"
label_key = "media_mini.settings.background_darkening.label"
description_key = "media_mini.settings.background_darkening.description"
default = 0
min = 0
max = 60
step = 1

[[widget.setting]]
key = "background_width"
visible_when = { key = "progress_layout", values = ["background"] }
type = "int"
label_key = "media_mini.settings.background_width.label"
description_key = "media_mini.settings.background_width.description"
default = 260
min = 120
max = 700
step = 2

[[widget.setting]]
key = "background_expand_width"
visible_when = { key = "progress_layout", values = ["background"] }
type = "int"
label_key = "media_mini.settings.background_expand_width.label"
description_key = "media_mini.settings.background_expand_width.description"
default = 420
min = 120
max = 1000
step = 2

[[widget.setting]]
key = "background_height"
visible_when = { key = "progress_layout", values = ["background"] }
type = "int"
label_key = "media_mini.settings.background_height.label"
description_key = "media_mini.settings.background_height.description"
default = 22
min = 16
max = 40
step = 1

[[widget.setting]]
key = "background_seek_strip"
visible_when = { key = "progress_layout", values = ["background"] }
type = "bool"
label_key = "media_mini.settings.background_seek_strip.label"
description_key = "media_mini.settings.background_seek_strip.description"
default = true

[[widget.setting]]
key = "progress_style"
visible_when = { key = "progress_layout", values = ["inline"] }
type = "select"
label_key = "media_mini.settings.progress_style.label"
description_key = "media_mini.settings.progress_style.description"
default = "classic"
options = [
  { value = "classic", label_key = "media_mini.settings.progress_style.options.classic" },
  { value = "classic_drag", label_key = "media_mini.settings.progress_style.options.classic_drag" },
  { value = "interactive", label_key = "media_mini.settings.progress_style.options.interactive" },
]

[[widget.setting]]
key = "progress_width"
visible_when = { key = "progress_layout", values = ["inline"] }
type = "int"
label_key = "media_mini.settings.progress_width.label"
description_key = "media_mini.settings.progress_width.description"
default = 35
min = 24
max = 300
step = 2

[[widget.setting]]
key = "progress_expand_width"
visible_when = { key = "progress_layout", values = ["inline"] }
type = "int"
label_key = "media_mini.settings.progress_expand_width.label"
description_key = "media_mini.settings.progress_expand_width.description"
default = 35
min = 24
max = 500
step = 2

[[widget.setting]]
key = "progress_thickness"
visible_when = { key = "progress_layout", values = ["inline"] }
type = "int"
label_key = "media_mini.settings.progress_thickness.label"
description_key = "media_mini.settings.progress_thickness.description"
default = 8
min = 4
max = 24
step = 1

[[widget.setting]]
key = "bar_color"
visible_when = { key = "progress_layout", values = ["inline"] }
type = "color"
label_key = "media_mini.settings.bar_color.label"
description_key = "media_mini.settings.bar_color.description"
default = "on_surface"

[[widget.setting]]
key = "compact_width"
visible_when = { key = "progress_layout", values = ["inline"] }
type = "int"
label_key = "media_mini.settings.compact_width.label"
description_key = "media_mini.settings.compact_width.description"
default = 20
min = 8
max = 60
step = 1

[[widget.setting]]
key = "expand_width"
visible_when = { key = "progress_layout", values = ["inline"] }
type = "int"
label_key = "media_mini.settings.expand_width.label"
description_key = "media_mini.settings.expand_width.description"
default = 40
min = 8
max = 100
step = 1
