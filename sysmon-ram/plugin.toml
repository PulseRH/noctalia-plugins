id = "pulser/sysmon-ram"
name = "RAM (mini)"
version = "0.3.2"
plugin_api = 31
min_noctalia = "5.2.0"
author = "pulser"
license = "MIT"
dependencies = []
tags = ["system"]
icon = "memory"
description = "Compact gauge bar or plain percentage (toggle below); hover reveals the other figure -- used/total GB by default, or the percentage if you show the amount by default instead. Total is auto-detected."

[[widget]]
id = "ram"
entry = "ram.luau"

  [[widget.setting]]
  key = "gauge"
  type = "bool"
  label_key = "settings.gauge.label"
  description_key = "settings.gauge.description"
  default = true

  [[widget.setting]]
  key = "amount_first"
  type = "bool"
  label_key = "settings.amount_first.label"
  description_key = "settings.amount_first.description"
  default = false
