id = "pulser/sysmon-cpu"
name = "CPU (mini)"
version = "0.2.0"
plugin_api = 32
min_noctalia = "5.2.0"
author = "pulser"
license = "MIT"
dependencies = []
tags = ["system"]
icon = "cpu-usage"
description = "Compact gauge bar or plain percentage (toggle below); optional GPU usage; hover shows clock speed and package wattage."

[[widget]]
id = "cpu"
entry = "cpu.luau"

  [[widget.setting]]
  key = "gauge"
  type = "bool"
  label_key = "settings.gauge.label"
  description_key = "settings.gauge.description"
  default = true

[[widget.setting]]
key = "show_gpu"
type = "bool"
label_key = "settings.show_gpu.label"
description_key = "settings.show_gpu.description"
default = true
